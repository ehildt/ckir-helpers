name: RELEASE_CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  HUSKY: 0

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Lint, build and test are shared with the non-release pipeline via ci.yml.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      upload-coverage: true
      upload-artifacts: true
    secrets: inherit

  repo-update:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pnpm -r install --frozen-lockfile

      - name: Changeset
        run: pnpm changeset version

      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "VERSION BUMP"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Depbadge
        run: npx @ehildt/depbadge

      - name: Commit badge bump
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "BADGE BUMP"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wiki:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Sync wiki
        run: |
          test -d .wiki || { echo "::error::.wiki folder missing"; exit 1; }
          rsync -a --delete --exclude '.git/' .wiki/ wiki/

      - name: Commit wiki
        working-directory: wiki
        run: |
          git config user.name "wiki[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "WIKI UPDATE"
          git push

  publish:
    if: github.event_name == 'push'
    needs: [repo-update, wiki]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # ensure we can see the latest commits

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: pnpm -r install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Version bump & publish
        run: |
          # Apply changeset version bump locally
          pnpm changeset version

          # Reinstall to update lockfile after version bump
          pnpm install --frozen-lockfile

          # Publish to npm directly using the bumped version
          pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
